<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092d43">
<title>SURF ARCADE — Pixel Barrel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08263b;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));text-shadow:2px 2px #102f48}.top{display:flex;justify-content:space-between;align-items:flex-start;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,1.5vw,14px)}.sub{display:block;color:#b5f5e9;font-size:9px;letter-spacing:.18em;margin-top:4px}.score{text-align:right;font-variant-numeric:tabular-nums}.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px;font-size:9px;letter-spacing:.12em;color:#e0ffff}.controls{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.controls button{font:900 11px system-ui;letter-spacing:.08em;color:#fff;background:#082d43e8;border:2px solid #b5f5e9;border-radius:3px;padding:12px 15px;min-width:70px;box-shadow:3px 3px 0 #061c2b;touch-action:manipulation}.controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #061c2b}.controls .primary{background:#f4d35e;color:#16354a;border-color:#fff1a8}.move{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:82px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.move button{width:48px;height:48px;font-size:22px;font-weight:900;color:white;background:#082d43e8;border:2px solid #b5f5e9;border-radius:3px;touch-action:manipulation}.banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:3px 3px #17334a;transition:opacity .2s}.banner h1{font-size:clamp(26px,5vw,54px);line-height:.9;letter-spacing:-.04em;margin:0;color:#ffe66d}.banner p{font-size:11px;font-weight:800;letter-spacing:.12em}.rotate{display:none;position:fixed;inset:0;background:#092d43;z-index:5;align-items:center;justify-content:center;text-align:center;padding:25px}.rotate strong{display:block;font-size:18px}.rotate span{font-size:36px;display:block;margin-bottom:12px}@media(orientation:portrait){.rotate{display:flex}.hud,.controls,.move,.banner{display:none}}@media(max-height:400px){.controls{bottom:8px}.controls button{padding:8px 10px;min-width:60px}.move{bottom:58px}.move button{width:40px;height:40px}.bottom{font-size:8px}}
</style>
</head>
<body>
<canvas id="game" width="480" height="270" aria-label="Juego retro de surf"></canvas>
<div class="hud"><div class="top"><div>EPYX-STYLE SURF<span class="sub">PIXEL BARREL · SESSION 01</span></div><div class="score">SCORE <span id="score">00000</span><span class="sub" id="status">TRIM · 62 KM/H</span></div></div><div class="bottom"><span id="waveLabel">WAVE 1 / 3</span><span>↑ ↓ ALTURA · CARVE · AÉREO</span></div></div>
<div class="banner" id="banner"><h1>SHOOT THE CURL!</h1><p>ENTRA EN EL TUBO Y MANTÉN EL EQUILIBRIO</p></div>
<div class="move"><button id="up" aria-label="Subir por la ola">↑</button><button id="down" aria-label="Bajar por la ola">↓</button></div>
<div class="controls"><button id="carve">CARVE</button><button id="air">AÉREO</button><button id="restart" class="primary">RESTART ↻</button></div>
<div class="rotate"><div><span>▱ ↻</span><strong>GIRA EL MÓVIL</strong><p>El surf se juega en horizontal.</p></div></div>
<script>
(()=> {
const c=document.getElementById('game'),g=c.getContext('2d'),W=480,H=270;
g.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
let time=0,score=0,height=.52,carve=0,air=0,airStart=0,wave=1,waveClock=0,combo=0,gameState='ride',bannerTimer=3.8,foamSeed=0,last=0;
const keys={}; let touchY=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function polygon(pts,col){g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill()}
function label(s,x,y,size,col){g.font='bold '+size+'px monospace';g.fillStyle=col;g.fillText(s,x,y)}
function bg(){
 const sky=['#65c8d5','#7bd8d9','#a6e7d8'];for(let y=0;y<150;y+=5)box(0,y,W,5,sky[Math.min(2,Math.floor(y/55))]);
 box(0,116,W,2,'#f8e59a');box(0,119,W,7,'#64b9c2');box(0,126,W,7,'#318da5');
 box(36,39,45,5,'#e4f5dd');box(26,44,63,5,'#e4f5dd');box(315,55,38,5,'#e4f5dd');box(305,60,57,5,'#e4f5dd');
 box(369,25,24,24,'#ffe66d');box(375,19,12,5,'#ffe66d');box(375,50,12,5,'#ffe66d');
 for(let i=0;i<12;i++){let x=((i*49-time*7)%510+510)%510;box(x,135+(i%3)*4,17,2,'#c3f3dc')}
}
function waveShape(){
 const phase=time*.55, crest=305+Math.sin(phase)*7, top=76+Math.sin(time*.9)*4;
 // Body of the wave: the profile grows from the lower-left into a tall pitching crest.
 const outer=[[0,190],[35,181],[70,170],[105,157],[140,142],[175,125],[208,106],[238,88],[264,72],[286,top+2],[crest-26,top-3],[crest-43,top-9],[crest-57,top-5],[crest-68,top+5],[crest-70,top+18],[crest-64,top+31],[crest-52,top+40],[crest-42,top+48],[crest-32,top+64],[crest-23,top+86],[crest-11,top+113],[crest+7,top+143],[crest+28,top+172],[crest+52,top+199],[480,270],[0,270]];
 polygon(outer,'#087b98');
 const face=[[0,207],[42,194],[83,179],[122,161],[160,142],[196,121],[229,101],[255,83],[280,top+3],[crest-28,top-3],[crest-44,top-9],[crest-58,top-5],[crest-69,top+5],[crest-70,top+18],[crest-64,top+31],[crest-52,top+40],[crest-42,top+48],[crest-32,top+64],[crest-23,top+86],[crest-11,top+113],[crest+7,top+143],[crest+28,top+172],[crest+52,top+199],[480,270],[0,270]];
 polygon(face,'#0bb1bc');
 polygon([[0,229],[48,211],[92,192],[135,170],[173,148],[210,124],[244,103],[270,top+17],[crest-50,top+5],[crest-62,top+12],[crest-64,top+23],[crest-56,top+33],[crest-45,top+37],[crest-34,top+49],[crest-25,top+71],[crest-14,top+100],[crest+4,top+137],[crest+31,top+180],[crest+55,top+205],[480,270],[0,270]],'#08738c');
 // Hollow barrel cavity and dark inner shadow.
 polygon([[crest-68,top+13],[crest-61,top+1],[crest-49,top-4],[crest-38,top+1],[crest-30,top+12],[crest-27,top+25],[crest-31,top+39],[crest-40,top+51],[crest-53,top+59],[crest-66,top+61],[crest-78,top+56],[crest-84,top+45],[crest-85,top+32]],'#06445d');
 // inner turquoise reflected light makes the hollow read as a tunnel, not a hole.
 polygon([[crest-74,top+34],[crest-68,top+24],[crest-58,top+18],[crest-48,top+21],[crest-42,top+31],[crest-43,top+41],[crest-52,top+49],[crest-64,top+52],[crest-74,top+47]],'#087f91');
 // Lip: bright foam curls over the hollow.
 polygon([[256,79],[278,64],[300,top-4],[crest-35,top-15],[crest-49,top-18],[crest-63,top-12],[crest-74,top],[crest-79,top+11],[crest-69,top+8],[crest-59,top],[crest-47,top-5],[crest-36,top+2],[crest-26,top+18],[crest-19,top+39],[crest-13,top+62],[crest-4,top+84],[crest+5,top+94],[crest+2,top+70],[crest-4,top+45],[crest-10,top+24],[crest-18,top+8],[crest-28,top-3]],'#f1fff0');
 // pixel foam attached to the breaking edge; the pattern travels with the wave.
 for(let i=0;i<45;i++){const x=(i*17+time*28)%500;const y=157+Math.sin(i*1.9+time*2)*26;box(x,y,3+(i%3)*2,2+(i%2)*2,i%4===0?'#f5fff0':'#9af1df')}
 for(let i=0;i<22;i++){const x=crest-78+((i*11+time*16)%100),y=top+6+((i*7)%32);box(x,y,3,3,'#f5fff0')}
 // Foreground wash.
 for(let i=0;i<20;i++){let x=((i*31-time*17)%510+510)%510;box(x,250+(i%3)*4,15,2,'#3dc5c5');box(x+8,257+(i%2)*3,8,2,'#b7f7df')}
 return {crest,top};
}
function surfer(){
 const x=158+carve*5;
 // Height maps to the wave face. The board is carried by the wave, not fixed in place.
 const waveSurface=208-height*126;
 const jump=air>0?Math.sin(clamp((time-airStart)/.9,0,1)*Math.PI)*40:0;
 const y=waveSurface-jump;
 g.save();g.translate(Math.round(x),Math.round(y));g.rotate(carve*.07+(air>0?-.28:0));
 // board, rails and tail
 polygon([[-25,7],[-18,3],[19,4],[26,8],[17,12],[-17,11]],'#ffe66d');box(-15,7,28,2,'#f8fff0');box(-22,8,5,2,'#f08b55');
 // legs and bent stance
 polygon([[-5,-5],[1,-5],[7,3],[14,6],[11,10],[2,8],[-3,2]],'#f5bd83');
 polygon([[-4,-5],[2,-3],[-4,5],[-10,7],[-13,4],[-7,1]],'#f5bd83');
 polygon([[-6,-20],[5,-20],[10,-8],[3,-3],[-8,-6]],'#ef684e');
 polygon([[-4,-18],[-12,-11],[-20,-13],[-21,-10],[-10,-6],[-1,-12]],'#f5bd83');
 polygon([[4,-18],[11,-14],[17,-20],[20,-18],[13,-8],[5,-10]],'#f5bd83');
 box(-6,-29,12,12,'#17435a');box(-5,-35,10,8,'#b97852');box(-6,-37,12,4,'#f7d16a');box(-7,-38,13,3,'#21384c');
 g.restore();
 if(air>0)label('AIR!',x+13,y-40,9,'#ffe66d');
}
function draw(){
 bg();const w=waveShape();surfer();
 // Small board wake and spray show contact with the moving water.
 for(let i=0;i<7;i++){box(130-i*5,208-height*126+8+(i%3)*3,3,2,i%2?'#f0fff0':'#73e5d5')}
 if(height>.42&&height<.74){box(217,138,2,2,'#f4fff0');box(225,143,2,2,'#f4fff0');box(233,148,2,2,'#f4fff0')}
 if(gameState==='wipeout'){box(125,185,38,3,'#fff');label('WIPEOUT!',178,155,13,'#ffe66d')}
}
function changeHeight(d){height=clamp(height+d,.1,.93)}
function trickAir(){if(air<=0&&gameState==='ride'){air=1;airStart=time;}}
function doCarve(){if(gameState!=='ride')return;carve=carve===0?1:carve===1?-1:0;if(height>.28&&height<.85){score+=25;combo++;}}
function reset(){time=0;score=0;height=.52;carve=0;air=0;wave=1;waveClock=0;combo=0;gameState='ride';bannerTimer=3.8;$('waveLabel').textContent='WAVE 1 / 3';$('banner').style.opacity='1';$('banner').querySelector('h1').textContent='SHOOT THE CURL!';}
$('up').addEventListener('click',()=>changeHeight(.075));$('down').addEventListener('click',()=>changeHeight(-.075));$('carve').addEventListener('click',doCarve);$('air').addEventListener('click',trickAir);$('restart').addEventListener('click',reset);
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key===' '||e.key==='x')trickAir();if(e.key==='ArrowLeft'||e.key==='a')doCarve();if(e.key==='ArrowRight'||e.key==='d')doCarve()});
addEventListener('keyup',e=>keys[e.key]=false);
c.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});c.addEventListener('touchmove',e=>{if(touchY!==null){const dy=e.touches[0].clientY-touchY;if(Math.abs(dy)>12){changeHeight(dy<0?.025:-.025);touchY=e.touches[0].clientY}}},{passive:true});c.addEventListener('touchend',()=>touchY=null,{passive:true});
function frame(now){
 const dt=Math.min(.04,(now-last)/1000||.016);last=now;time+=dt;waveClock+=dt;bannerTimer=Math.max(0,bannerTimer-dt);if(bannerTimer===0)$('banner').style.opacity='0';
 if(keys.ArrowUp||keys.w)changeHeight(dt*.3);if(keys.ArrowDown||keys.s)changeHeight(-dt*.3);
 if(gameState==='ride'){
   // The wave carries the rider; line choice controls scoring and risk.
   if(height>.36&&height<.76)score+=Math.round(dt*7);
   if(air>0){air=Math.max(0,1-(time-airStart)/.9);if(air===0){if(height>.32&&height<.86){score+=150;combo++;}else{gameState='wipeout';setTimeout(()=>{gameState='ride';height=.5;},850)}}}
   if(height<.13||height>.91){gameState='wipeout';air=0;setTimeout(()=>{gameState='ride';height=.5;},850)}
   if(waveClock>12){waveClock=0;wave=wave%3+1;$('waveLabel').textContent='WAVE '+wave+' / 3';score+=100;height=.52;}
 }
 draw();$('score').textContent=String(score).padStart(5,'0').slice(-5);$('status').textContent=gameState==='wipeout'?'WIPEOUT · RECOVER':height>.42&&height<.74?'IN THE BARREL · '+Math.round(58+height*10)+' KM/H':'TRIM · '+Math.round(58+height*10)+' KM/H';
 requestAnimationFrame(frame);
}
frame(0);
})();
</script>
</body>
</html>
