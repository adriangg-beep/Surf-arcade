<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092d43">
<title>SURF ARCADE — Pixel Barrel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08263b;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));text-shadow:2px 2px #102f48}.top{display:flex;justify-content:space-between;align-items:flex-start;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,1.5vw,14px)}.sub{display:block;color:#b5f5e9;font-size:9px;letter-spacing:.18em;margin-top:4px}.score{text-align:right;font-variant-numeric:tabular-nums}.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px;font-size:9px;letter-spacing:.12em;color:#e0ffff}.controls{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.controls button{font:900 11px system-ui;letter-spacing:.08em;color:#fff;background:#082d43e8;border:2px solid #b5f5e9;border-radius:3px;padding:12px 15px;min-width:70px;box-shadow:3px 3px 0 #061c2b;touch-action:manipulation}.controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #061c2b}.controls .primary{background:#f4d35e;color:#16354a;border-color:#fff1a8}.move{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:82px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.move button{width:48px;height:48px;font-size:22px;font-weight:900;color:white;background:#082d43e8;border:2px solid #b5f5e9;border-radius:3px;touch-action:manipulation}.banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:3px 3px #17334a;transition:opacity .2s}.banner h1{font-size:clamp(26px,5vw,54px);line-height:.9;letter-spacing:-.04em;margin:0;color:#ffe66d}.banner p{font-size:11px;font-weight:800;letter-spacing:.12em}.rotate{display:none;position:fixed;inset:0;background:#092d43;z-index:5;align-items:center;justify-content:center;text-align:center;padding:25px}.rotate strong{display:block;font-size:18px}.rotate span{font-size:36px;display:block;margin-bottom:12px}@media(orientation:portrait){.rotate{display:flex}.hud,.controls,.move,.banner{display:none}}@media(max-height:400px){.controls{bottom:8px}.controls button{padding:8px 10px;min-width:60px}.move{bottom:58px}.move button{width:40px;height:40px}.bottom{font-size:8px}}
</style>
</head>
<body>
<canvas id="game" width="480" height="270" aria-label="Juego retro de surf"></canvas>
<div class="hud"><div class="top"><div>EPYX-STYLE SURF<span class="sub">PIXEL BARREL · SESSION 01</span></div><div class="score">SCORE <span id="score">00000</span><span class="sub" id="status">TRIM · 62 KM/H</span></div></div><div class="bottom"><span id="waveLabel">WAVE 1 / 3</span><span>↑ ↓ ALTURA · CARVE · AÉREO</span></div></div>
<div class="banner" id="banner"><h1>SHOOT THE CURL!</h1><p>ENTRA EN EL TUBO Y MANTÉN EL EQUILIBRIO</p></div>
<div class="move"><button id="up" aria-label="Subir por la ola">↑</button><button id="down" aria-label="Bajar por la ola">↓</button></div>
<div class="controls"><button id="carve">CARVE</button><button id="air">AÉREO</button><button id="restart" class="primary">RESTART ↻</button></div>
<div class="rotate"><div><span>▱ ↻</span><strong>GIRA EL MÓVIL</strong><p>El surf se juega en horizontal.</p></div></div>
<script>
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=480,H=270;
let t=0,score=0,height=.56,speed=1,carve=0,air=0,waveNo=1,barrelTime=0,ended=false;
const keys={};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function poly(points,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function text(s,x,y,size,c){ctx.font='bold '+size+'px monospace';ctx.fillStyle=c;ctx.fillText(s,x,y)}
function background(){
const sky=['#6bd1dc','#8de0d9','#b2e9d2'];for(let y=0;y<160;y+=6)rect(0,y,W,6,sky[Math.min(2,Math.floor(y/60))]);
rect(0,118,W,3,'#f8df89');rect(0,121,W,8,'#56b6c1');rect(0,129,W,12,'#318fa9');
rect(35,35,46,6,'#e6f6d7');rect(24,41,64,6,'#e6f6d7');rect(310,55,38,6,'#e6f6d7');rect(300,61,56,6,'#e6f6d7');
rect(365,28,26,26,'#ffe66d');rect(371,22,14,6,'#ffe66d');rect(371,54,14,6,'#ffe66d');
for(let i=0;i<14;i++){let x=((i*47-t*12)%520+520)%520;rect(x,133+(i%3)*4,20,2,'#c3f3dc')}
}
function drawWave(){
/* Side-on stepped silhouette: the curl folds left over a dark, readable barrel cavity. */
const drift=(t*9)%60, crestX=330+Math.sin(t*.4)*8, crestY=70+Math.sin(t*.7)*5;
poly([[0,158],[40,154],[80,149],[120,140],[160,128],[200,111],[235,94],[260,79],[crestX-24,crestY+2],[crestX-34,crestY-8],[crestX-48,crestY-11],[crestX-62,crestY-5],[crestX-73,crestY+8],[crestX-76,crestY+23],[crestX-68,crestY+34],[crestX-56,crestY+38],[crestX-44,crestY+31],[crestX-38,crestY+22],[crestX-33,crestY+16],[crestX-25,crestY+17],[crestX-17,crestY+29],[crestX-12,crestY+45],[crestX-8,crestY+66],[crestX-2,crestY+89],[crestX+8,crestY+116],[crestX+25,crestY+145],[crestX+48,crestY+175],[480,270],[0,270]],'#087f9c');
/* Deep shaded face with stepped turquoise highlights. */
poly([[0,174],[48,166],[94,155],[140,141],[185,121],[220,104],[253,86],[281,73],[305,66],[crestX-34,crestY-8],[crestX-48,crestY-11],[crestX-62,crestY-5],[crestX-73,crestY+8],[crestX-76,crestY+23],[crestX-68,crestY+34],[crestX-56,crestY+38],[crestX-44,crestY+31],[crestX-38,crestY+22],[crestX-33,crestY+16],[crestX-25,crestY+17],[crestX-17,crestY+29],[crestX-12,crestY+45],[crestX-8,crestY+66],[crestX-2,crestY+89],[crestX+8,crestY+116],[crestX+25,crestY+145],[crestX+48,crestY+175],[480,270],[0,270]],'#11b5bd');
poly([[0,204],[62,188],[118,168],[168,146],[210,124],[245,105],[272,88],[297,76],[crestX-47,crestY-1],[crestX-61,crestY+6],[crestX-67,crestY+17],[crestX-63,crestY+27],[crestX-54,crestY+29],[crestX-44,crestY+22],[crestX-35,crestY+27],[crestX-25,crestY+45],[crestX-16,crestY+72],[crestX-3,crestY+105],[crestX+15,crestY+139],[crestX+42,crestY+177],[480,270],[0,270]],'#08758e');
/* The hollow tunnel is cut out visually with the sky/deep-water palette. */
poly([[crestX-69,crestY+12],[crestX-61,crestY+1],[crestX-49,crestY-3],[crestX-38,crestY+2],[crestX-31,crestY+13],[crestX-27,crestY+27],[crestX-31,crestY+40],[crestX-40,crestY+51],[crestX-52,crestY+58],[crestX-65,crestY+61],[crestX-77,crestY+57],[crestX-84,crestY+47],[crestX-85,crestY+34]],'#06475f');
/* White lip and chunky foam tiles. */
poly([[260,79],[281,65],[304,58],[crestX-35,crestY-13],[crestX-49,crestY-18],[crestX-63,crestY-12],[crestX-74,crestY+1],[crestX-78,crestY+11],[crestX-67,crestY+7],[crestX-58,crestY-1],[crestX-47,crestY-5],[crestX-36,crestY+2],[crestX-25,crestY+17],[crestX-17,crestY+38],[crestX-12,crestY+62],[crestX-2,crestY+85],[crestX+5,crestY+91],[crestX+1,crestY+68],[crestX-4,crestY+44],[crestX-10,crestY+25],[crestX-18,crestY+9],[crestX-29,crestY-2]],'#f3fff0');
for(let i=0;i<34;i++){let x=(i*19+t*29)%490;let y=164+Math.sin(i*1.8+t*2)*22;rect(x,y,4+(i%4)*2,2+(i%3)*2,i%3===0?'#efffe8':'#8df3df')}
for(let i=0;i<18;i++){let x=crestX-75+((i*13+t*22)%100),y=crestY+8+((i*7)%28);rect(x,y,3,3,'#f5fff0')}
}
function drawSurfer(){
const x=170+carve*9, y=194-height*115-(air>0?Math.sin((1-air)*Math.PI)*36:0);
ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(carve*.08+(air>0?-.22:0));
/* board */
poly([[-23,7],[-16,3],[19,5],[25,9],[16,12],[-16,11]],'#ffe66d');rect(-14,7,27,2,'#f9fff0');
/* legs */
poly([[-5,-4],[1,-4],[7,4],[13,7],[10,10],[2,8],[-3,2]],'#f5bd83');
poly([[-4,-4],[2,-3],[-4,5],[-10,7],[-13,4],[-7,1]],'#f5bd83');
/* shorts/body/arms */
poly([[-6,-19],[5,-20],[10,-8],[3,-3],[-8,-6]],'#ed684e');
poly([[-4,-18],[-12,-11],[-20,-13],[-21,-10],[-10,-6],[-1,-12]],'#f5bd83');
poly([[4,-18],[11,-14],[17,-20],[20,-18],[13,-8],[5,-10]],'#f5bd83');
rect(-6,-28,12,11,'#17435a');rect(-5,-34,10,8,'#b97852');rect(-6,-36,12,4,'#f7d16a');rect(-7,-37,13,3,'#21384c');
ctx.restore();
}
function drawTubeHint(){if(height>.45&&height<.76){rect(244,125,2,2,'#e9fff4');rect(251,130,2,2,'#e9fff4');rect(258,136,2,2,'#e9fff4')}}
function draw(){
background();drawWave();drawTubeHint();drawSurfer();
/* foreground wash */
for(let i=0;i<20;i++){const x=(i*31-t*20)%510;rect(x,250+(i%3)*4,15,2,'#3dc5c5');rect(x+8,257+(i%2)*3,8,2,'#b7f7df')}
if(air>0){text('AIR!',187,144,10,'#ffe66d')}
}
function tick(){
t+=.035;
if(keys.ArrowUp||keys.w)height=Math.min(.92,height+.006);
if(keys.ArrowDown||keys.s)height=Math.max(.12,height-.006);
height+=Math.sin(t*.55)*.0009;
if(air>0)air=Math.max(0,air-.012);
if(!ended){score+=Math.max(0,Math.round(2+(height>.45&&height<.77?3:0)+Math.abs(carve)*.6));}
draw();
document.getElementById('score').textContent=String(score).padStart(5,'0').slice(-5);
document.getElementById('status').textContent=(height>.45&&height<.77?'IN THE BARREL':'TRIM')+' · '+Math.round(58+height*10)+' KM/H';
if(t>27*waveNo){waveNo++;if(waveNo>3)waveNo=1;document.getElementById('waveLabel').textContent='WAVE '+waveNo+' / 3';score+=250}
requestAnimationFrame(tick);
}
function changeHeight(n){height=Math.max(.12,Math.min(.92,height+n))}
document.getElementById('up').addEventListener('click',()=>changeHeight(.08));
document.getElementById('down').addEventListener('click',()=>changeHeight(-.08));
document.getElementById('carve').addEventListener('click',()=>{carve=carve===0?1:carve===1?-1:0;score+=35});
document.getElementById('air').addEventListener('click',()=>{if(air===0){air=1;score+=height>.42&&height<.82?100:20}});
document.getElementById('restart').addEventListener('click',()=>{t=0;score=0;height=.56;carve=0;air=0;waveNo=1;ended=false;document.getElementById('waveLabel').textContent='WAVE 1 / 3';document.getElementById('banner').style.opacity='0'});
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key===' ')document.getElementById('air').click();if(e.key==='ArrowLeft')document.getElementById('carve').click()});
addEventListener('keyup',e=>keys[e.key]=false);
let startY=null;canvas.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchmove',e=>{if(startY!==null){const dy=e.touches[0].clientY-startY;if(Math.abs(dy)>14){changeHeight(dy<0?.025:-.025);startY=e.touches[0].clientY}}},{passive:true});
setTimeout(()=>{document.getElementById('banner').style.opacity='0'},4200);
tick();
})();
</script>
</body>
</html>
